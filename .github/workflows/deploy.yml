name: Deploy

# ── What actually reaches aetheraonline.com ──────────────────────────────────
# Triggered by a version tag, not by a branch. The consequence is the point: the
# thing running in production always has a version number, and rolling back is
# `workflow_dispatch` with an older tag rather than an archaeology exercise.
#
# This builds the container image and deploys the Worker in one `wrangler deploy`
# — wrangler builds the Dockerfile, pushes it to Cloudflare's registry, and
# points the Worker at it. There is no separate registry step to get out of sync.

on:
  # Kept for a tag pushed by a PERSON, which does start workflows.
  push:
    tags: ["v*"]
  # How release.yml hands off. It has to call this explicitly, because the tag
  # it pushes is pushed with GITHUB_TOKEN and GitHub will not start a workflow
  # from that — the first release tagged v0.1.1 and no deploy run was created
  # at all. Nothing failed; there was simply nothing, which is the shape of
  # outage nobody notices.
  workflow_call:
    inputs:
      tag:
        description: "Tag to deploy."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.2.0). Use this to roll back."
        required: true
        type: string

concurrency:
  group: deploy-production
  # Two deploys overlapping would race to point the Worker at different images.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://orion.aetheraonline.com
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the tag, whether it came from the push or from a manual
          # rollback. Checking out a branch here would mean the tag named one
          # thing and the deploy shipped another.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The tag was tested at release time, but a rollback deploys an OLD tag
      # whose tests last ran against an older toolchain. Cheap enough to repeat,
      # and this is the last gate before PHI infrastructure changes.
      - run: npm test
      - run: npm run build

      # Fails the deploy rather than shipping a container that will refuse every
      # request. src/gateway/auth.ts is deliberately fail-closed: bound off
      # loopback with no token, it serves nothing — which is safe, and would be
      # a silent outage if this were not checked here.
      - name: Preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: node scripts/preflight.mjs

      - name: Check the required secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$GATEWAY_TOKEN" ]         || missing="$missing GATEWAY_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Push the shared secret to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo -n "${{ secrets.GATEWAY_TOKEN }}" | npx wrangler secret put GATEWAY_TOKEN

      # ── The model provider key ────────────────────────────────────────────
      # Whichever of these repository secrets exist are pushed; the rest are
      # skipped. Optional rather than required because the deployment is
      # perfectly valid with none — the console, the seeded data, the KPIs and
      # the worklist all work — it is only the agent's turns that need a model.
      #
      # Read from `env` rather than interpolated into the command: a secret in a
      # shell argument is visible in `ps` to anything else on the runner, and
      # this loop would put four of them there.
      - name: Push whichever provider keys are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          pushed=""
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY OLLAMA_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              pushed="$pushed $name"
            fi
          done
          if [ -z "$pushed" ]; then
            echo "No provider key secrets are set. The console will deploy and work;"
            echo "the agent will have no model to talk to until one is added."
          else
            echo "Pushed provider key(s):$pushed"
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Reaches the container as an environment variable, and is what the
          # gateway compares the edge's header against.
          ORION_GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: npx wrangler deploy --var ORION_VERSION:${{ inputs.tag || github.ref_name }}

      # A deploy that reports success while the origin is down is worse than a
      # failed one, because nobody looks. Containers take a few minutes to
      # provision on first deploy, so this retries rather than checking once.
      # ── Did the edge actually start serving this hostname? ─────────────────
      # A 302 counts as success, and that is the whole correction here. The
      # first real deploy polled thirty times, got HTTP 302 every time, and
      # reported "never became healthy" over a deployment that was working
      # perfectly: Cloudflare Access sits IN FRONT of the Worker and redirects
      # an unauthenticated request to its login page, so /healthz — which is
      # deliberately unauthenticated inside the gateway — is never reached by a
      # probe that has no Access session. There is no credential this step
      # could hold that would change that.
      #
      # So the question this step can honestly answer is not "is the container
      # healthy" but "is this hostname being served by our Worker at all",
      # which is what distinguishes a deploy that landed from one that did not.
      # 302 and 200 both answer yes; 000 (DNS or TLS never resolved) and 5xx
      # answer no.
      #
      # Claiming more than that would be worse than claiming less: a green tick
      # on "healthy" that only ever meant "Access answered" is the kind of
      # check people trust once and then stop reading.
      #
      # With Access removed (PUBLIC_ACCESS in wrangler.jsonc) a 200 is now the
      # expected answer and a 3xx means the OPPOSITE of healthy — it means an
      # Access application is still matching the hostname while the Worker and
      # the origin have both stopped expecting one, which is the configuration
      # that 403s every page. It is still accepted rather than failed on,
      # because it is a real deployment state during the transition; but it says
      # so loudly instead of calling it expected.
      - name: Verify the hostname is being served
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://orion.aetheraonline.com/healthz || true)
            case "$code" in
              200)
                echo "Serving, and reachable with no sign-in (attempt $i)."
                exit 0 ;;
              301|302|303|307|308)
                echo "Serving, but redirected (HTTP $code, attempt $i) — an Access application"
                echo "still matches this hostname. This deployment is configured public, so the"
                echo "sign-in page will not go away until that application is deleted:"
                echo "run the 'Access removal' workflow."
                exit 0 ;;
              *)
                echo "attempt $i: HTTP $code" ;;
            esac
            sleep 10
          done
          echo "The hostname never answered. The Worker may have deployed while the"
          echo "container is still provisioning, or the route/DNS has not propagated."
          exit 1
