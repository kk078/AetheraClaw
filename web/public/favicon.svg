<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#5e5ce6"/>
  </linearGradient></defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- O, for ORION. Drawn as a stroked circle rather than a glyph so it stays
       legible at 16px, where a font-rendered letter turns to mush. -->
  <circle cx="16" cy="16" r="6.4" stroke="#ffffff" stroke-width="2.8" fill="none"/>
</svg>
